<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1080" width="1300" height="1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6672"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/>
    </marker>
  </defs>

  <!-- explicit background so the diagram stays legible in GitHub dark mode -->
  <rect x="0" y="0" width="1300" height="1080" fill="#ffffff"/>

  <!-- ══════════════ TITLE ══════════════ -->
  <text x="650" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#1b2733">Snowflake &amp; dbt CI/CD Framework</text>
  <text x="650" y="65" text-anchor="middle" font-size="14" fill="#5a6672">Unified deployment of Snowflake objects (SchemaChange) and dbt projects</text>
  <text x="650" y="84" text-anchor="middle" font-size="12.5" fill="#8b95a1">Medallion Architecture &amp; Deployment Flow &#183; dev &#8594; DEV &#183; main &#8594; PROD</text>

  <!-- ══════════════ SECTION 1: CI/CD ══════════════ -->
  <rect x="30" y="92" width="1240" height="318" rx="10" fill="#f7f9fb" stroke="#d3dbe3" stroke-width="1.5"/>
  <text x="50" y="119" font-size="13" font-weight="700" fill="#42505e" letter-spacing="1.2">CI / CD  PIPELINE   —   GITHUB  ACTIONS</text>

  <!-- Row A: developer flow -->
  <g>
    <rect x="75" y="140" width="210" height="60" rx="7" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.5"/>
    <text x="180" y="165" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b2733">Feature branch</text>
    <text x="180" y="184" text-anchor="middle" font-size="11.5" fill="#6b7885">edit snowflake/ or dbt/</text>

    <rect x="310" y="140" width="210" height="60" rx="7" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.5"/>
    <text x="415" y="165" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b2733">Pull Request</text>
    <text x="415" y="184" text-anchor="middle" font-size="11.5" fill="#6b7885">target dev or main</text>

    <rect x="545" y="140" width="210" height="60" rx="7" fill="#fffaf0" stroke="#d9a441" stroke-width="1.8"/>
    <text x="650" y="165" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b2733">PR Validation</text>
    <text x="650" y="184" text-anchor="middle" font-size="11.5" fill="#6b7885">12 rules &#183; no Snowflake</text>

    <rect x="780" y="140" width="210" height="60" rx="7" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.5"/>
    <text x="885" y="165" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b2733">Merge</text>
    <text x="885" y="184" text-anchor="middle" font-size="11.5" fill="#6b7885">dev &#8594; DEV &#183; main &#8594; PROD</text>

    <rect x="1015" y="140" width="210" height="60" rx="7" fill="#eef4fb" stroke="#4a7fb5" stroke-width="1.8"/>
    <text x="1120" y="165" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b2733">deploy.py</text>
    <text x="1120" y="184" text-anchor="middle" font-size="11.5" fill="#6b7885">orchestrates 3 phases</text>

    <line x1="287" y1="170" x2="306" y2="170" stroke="#5a6672" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="522" y1="170" x2="541" y2="170" stroke="#5a6672" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="757" y1="170" x2="776" y2="170" stroke="#5a6672" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="992" y1="170" x2="1011" y2="170" stroke="#5a6672" stroke-width="1.8" marker-end="url(#arrow)"/>
  </g>

  <!-- connector down -->
  <path d="M 1120 202 L 1120 228 L 180 228 L 180 250" fill="none" stroke="#5a6672" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Row B: deploy phases -->
  <g>
    <rect x="75" y="252" width="210" height="76" rx="7" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.5"/>
    <text x="180" y="274" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a7fb5">STEP 1</text>
    <text x="180" y="293" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2733">Assign versions</text>
    <text x="180" y="311" text-anchor="middle" font-size="11" fill="#6b7885">V__x.sql &#8594; V1.2.3__x.sql</text>

    <rect x="310" y="252" width="210" height="76" rx="7" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.5"/>
    <text x="415" y="274" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a7fb5">STEP 2</text>
    <text x="415" y="293" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2733">Git repo FETCH</text>
    <text x="415" y="311" text-anchor="middle" font-size="11" fill="#6b7885">Snowpark &amp; Streamlit code</text>

    <rect x="545" y="252" width="210" height="76" rx="7" fill="#f0f7f2" stroke="#5a9367" stroke-width="2"/>
    <text x="650" y="274" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3f7a50">STEP 3 &#183; PRE-dbt</text>
    <text x="650" y="293" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2733">SchemaChange</text>
    <text x="650" y="311" text-anchor="middle" font-size="11" fill="#6b7885">procs, stages, grants&#8230;</text>

    <rect x="780" y="252" width="210" height="76" rx="7" fill="#fdf1f3" stroke="#c2566b" stroke-width="2"/>
    <text x="885" y="274" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a8455a">STEP 4</text>
    <text x="885" y="293" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2733">snow dbt deploy</text>
    <text x="885" y="311" text-anchor="middle" font-size="11" fill="#6b7885">publishes + runs dbt</text>

    <rect x="1015" y="252" width="210" height="76" rx="7" fill="#f0f7f2" stroke="#5a9367" stroke-width="2"/>
    <text x="1120" y="274" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3f7a50">STEP 5 &#183; POST-dbt</text>
    <text x="1120" y="293" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2733">SchemaChange</text>
    <text x="1120" y="311" text-anchor="middle" font-size="11" fill="#6b7885">dynamic tables</text>

    <line x1="287" y1="290" x2="306" y2="290" stroke="#5a6672" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="522" y1="290" x2="541" y2="290" stroke="#5a6672" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="757" y1="290" x2="776" y2="290" stroke="#5a6672" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="992" y1="290" x2="1011" y2="290" stroke="#5a6672" stroke-width="1.8" marker-end="url(#arrow)"/>
  </g>

  <text x="650" y="356" text-anchor="middle" font-size="11.5" fill="#8b5e00">Split around dbt: alert procedures must exist BEFORE dbt runs &#183; dynamic tables must be built AFTER dbt tables exist</text>
  <text x="650" y="380" text-anchor="middle" font-size="11.5" fill="#6b7885">Every migration recorded in CONFIG_DB.SCHEMACHANGE.{DEV|PROD}_CHANGE_HISTORY</text>

  <!-- deploy arrow into Snowflake -->
  <line x1="650" y1="412" x2="650" y2="446" stroke="#5a6672" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="668" y="436" font-size="11.5" font-style="italic" fill="#6b7885">deploys into</text>

  <!-- ══════════════ SECTION 2: SNOWFLAKE MEDALLION ══════════════ -->
  <rect x="30" y="452" width="1240" height="520" rx="10" fill="#f7f9fb" stroke="#d3dbe3" stroke-width="1.5"/>
  <text x="50" y="479" font-size="13" font-weight="700" fill="#42505e" letter-spacing="1.2">SNOWFLAKE   —   MEDALLION  ARCHITECTURE</text>

  <!-- SOURCE -->
  <rect x="60" y="500" width="230" height="200" rx="8" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.5"/>
  <rect x="60" y="500" width="230" height="34" rx="8" fill="#6b7885"/>
  <rect x="60" y="522" width="230" height="12" fill="#6b7885"/>
  <text x="175" y="523" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SOURCE</text>
  <text x="175" y="560" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2733">PostgreSQL</text>
  <text x="175" y="582" text-anchor="middle" font-size="11.5" fill="#6b7885">external ingestion</text>
  <text x="175" y="600" text-anchor="middle" font-size="11.5" fill="#6b7885">python/ framework</text>
  <line x1="85" y1="616" x2="265" y2="616" stroke="#e3e8ee" stroke-width="1"/>
  <text x="175" y="638" text-anchor="middle" font-size="11" fill="#6b7885">customers &#183; deals &#183; quotes</text>
  <text x="175" y="656" text-anchor="middle" font-size="11" fill="#6b7885">qb_invoices &#183; invoice_relation</text>
  <text x="175" y="681" text-anchor="middle" font-size="10.5" font-style="italic" fill="#98a4b0">declared in source.yml</text>

  <!-- BRONZE / RAW -->
  <rect x="350" y="500" width="230" height="200" rx="8" fill="#ffffff" stroke="#b87333" stroke-width="2"/>
  <rect x="350" y="500" width="230" height="34" rx="8" fill="#b87333"/>
  <rect x="350" y="522" width="230" height="12" fill="#b87333"/>
  <text x="465" y="523" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">BRONZE  &#183;  RAW</text>
  <text x="465" y="560" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2733">{ENV}_RAW</text>
  <text x="465" y="580" text-anchor="middle" font-size="11.5" fill="#6b7885">schema: postgres</text>
  <line x1="375" y1="596" x2="555" y2="596" stroke="#e3e8ee" stroke-width="1"/>
  <text x="465" y="618" text-anchor="middle" font-size="11.5" fill="#42505e">Landing tables, as-is</text>
  <text x="465" y="638" text-anchor="middle" font-size="11.5" fill="#42505e">No transformation</text>
  <line x1="375" y1="652" x2="555" y2="652" stroke="#e3e8ee" stroke-width="1"/>
  <text x="465" y="673" text-anchor="middle" font-size="11" font-weight="600" fill="#b87333">+ UTILS schema</text>
  <text x="465" y="690" text-anchor="middle" font-size="10.5" fill="#6b7885">logging &amp; alerting</text>

  <!-- SILVER / TRANSFORM -->
  <rect x="640" y="500" width="230" height="200" rx="8" fill="#ffffff" stroke="#7d8b99" stroke-width="2"/>
  <rect x="640" y="500" width="230" height="34" rx="8" fill="#7d8b99"/>
  <rect x="640" y="522" width="230" height="12" fill="#7d8b99"/>
  <text x="755" y="523" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SILVER  &#183;  TRANSFORM</text>
  <text x="755" y="560" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2733">{ENV}_TRANSFORM</text>
  <text x="755" y="580" text-anchor="middle" font-size="11.5" fill="#6b7885">schema: postgres</text>
  <line x1="665" y1="596" x2="845" y2="596" stroke="#e3e8ee" stroke-width="1"/>
  <text x="755" y="618" text-anchor="middle" font-size="11.5" fill="#42505e">Cleansed &#183; typed &#183; renamed</text>
  <text x="755" y="638" text-anchor="middle" font-size="11.5" fill="#42505e">One model per source table</text>
  <line x1="665" y1="652" x2="845" y2="652" stroke="#e3e8ee" stroke-width="1"/>
  <text x="755" y="673" text-anchor="middle" font-size="11" fill="#6b7885">incremental (append / merge)</text>
  <text x="755" y="690" text-anchor="middle" font-size="10.5" font-style="italic" fill="#98a4b0">watermark on load_dt</text>

  <!-- GOLD / CONSUMPTION -->
  <rect x="930" y="500" width="230" height="200" rx="8" fill="#ffffff" stroke="#c9a227" stroke-width="2"/>
  <rect x="930" y="500" width="230" height="34" rx="8" fill="#c9a227"/>
  <rect x="930" y="522" width="230" height="12" fill="#c9a227"/>
  <text x="1045" y="523" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">GOLD  &#183;  CONSUMPTION</text>
  <text x="1045" y="560" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b2733">{ENV}_CONSUMPTION</text>
  <text x="1045" y="580" text-anchor="middle" font-size="11.5" fill="#6b7885">schema: analytics</text>
  <line x1="955" y1="596" x2="1135" y2="596" stroke="#e3e8ee" stroke-width="1"/>
  <text x="1045" y="618" text-anchor="middle" font-size="11.5" fill="#42505e">dim_* &#183; fact_* &#183; snapshots</text>
  <text x="1045" y="638" text-anchor="middle" font-size="11.5" fill="#42505e">SCD2 history</text>
  <line x1="955" y1="652" x2="1135" y2="652" stroke="#e3e8ee" stroke-width="1"/>
  <text x="1045" y="673" text-anchor="middle" font-size="11" fill="#6b7885">BI / reporting layer</text>
  <text x="1045" y="690" text-anchor="middle" font-size="10.5" font-style="italic" fill="#98a4b0">eph_* inlined as CTEs</text>

  <!-- medallion arrows -->
  <line x1="292" y1="600" x2="346" y2="600" stroke="#5a6672" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="582" y1="600" x2="636" y2="600" stroke="#5a6672" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="872" y1="600" x2="926" y2="600" stroke="#5a6672" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="319" y="592" text-anchor="middle" font-size="10" fill="#8b95a1">load</text>
  <text x="609" y="592" text-anchor="middle" font-size="10" fill="#8b95a1">dbt</text>
  <text x="899" y="592" text-anchor="middle" font-size="10" fill="#8b95a1">dbt</text>

  <!-- ownership band -->
  <rect x="350" y="716" width="810" height="30" rx="6" fill="#fdf1f3" stroke="#c2566b" stroke-width="1.5"/>
  <text x="755" y="736" text-anchor="middle" font-size="12" font-weight="600" fill="#a8455a">All tables and views in these three layers are built by dbt models &#8212; never by SchemaChange</text>

  <!-- OBSERVABILITY -->
  <rect x="60" y="770" width="500" height="180" rx="8" fill="#ffffff" stroke="#b87333" stroke-width="1.8"/>
  <text x="80" y="796" font-size="12.5" font-weight="700" fill="#b87333">OBSERVABILITY &#8212; {ENV}_RAW.UTILS</text>

  <rect x="80" y="810" width="215" height="56" rx="6" fill="#faf6f1" stroke="#d3bda3" stroke-width="1.2"/>
  <text x="187" y="832" text-anchor="middle" font-size="12" font-weight="600" fill="#1b2733">LOG_HISTORY</text>
  <text x="187" y="851" text-anchor="middle" font-size="10.5" fill="#6b7885">one row per model, per run</text>

  <rect x="325" y="810" width="215" height="56" rx="6" fill="#faf6f1" stroke="#d3bda3" stroke-width="1.2"/>
  <text x="432" y="832" text-anchor="middle" font-size="12" font-weight="600" fill="#1b2733">SEND_*_ALERT</text>
  <text x="432" y="851" text-anchor="middle" font-size="10.5" fill="#6b7885">stored procedures</text>

  <line x1="297" y1="838" x2="321" y2="838" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrowGold)"/>

  <text x="80" y="890" font-size="11" fill="#42505e">on-run-end hooks &#8594; log_history_from_results() &#183; send_run_alert()</text>
  <text x="80" y="910" font-size="11" fill="#42505e">JOB_ID = &lt;invocation_id&gt;::&lt;node_unique_id&gt;</text>
  <text x="80" y="930" font-size="11" fill="#42505e">Exactly one email per run &#8212; summary on success, failures only on error</text>

  <!-- DEPLOYED BY -->
  <rect x="590" y="770" width="570" height="180" rx="8" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.5"/>
  <text x="610" y="796" font-size="12.5" font-weight="700" fill="#42505e">WHO  DEPLOYS  WHAT</text>

  <rect x="610" y="812" width="16" height="16" rx="3" fill="#f0f7f2" stroke="#5a9367" stroke-width="1.8"/>
  <text x="636" y="825" font-size="11.5" font-weight="600" fill="#1b2733">SchemaChange &#8212; snowflake/</text>
  <text x="636" y="843" font-size="10.5" fill="#6b7885">stored procs &#183; functions &#183; tasks &#183; streams &#183; pipes &#183; stages</text>
  <text x="636" y="859" font-size="10.5" fill="#6b7885">file formats &#183; dynamic tables &#183; Snowpark &#183; Streamlit &#183; grants</text>

  <rect x="610" y="878" width="16" height="16" rx="3" fill="#fdf1f3" stroke="#c2566b" stroke-width="1.8"/>
  <text x="636" y="891" font-size="11.5" font-weight="600" fill="#1b2733">dbt &#8212; dbt/models/</text>
  <text x="636" y="909" font-size="10.5" fill="#6b7885">every table and view &#183; snapshots &#183; run logging &amp; alerting</text>

  <text x="610" y="936" font-size="10.5" font-style="italic" fill="#98a4b0">Folder path sets the target:  snowflake/&lt;type&gt;/&lt;LAYER&gt;/&lt;SCHEMA&gt;/  &#8594;  {ENV}_{LAYER}.{SCHEMA}</text>

  <!-- footer -->
  <text x="650" y="1000" text-anchor="middle" font-size="11" fill="#98a4b0">dbt project object:  {ENV}_DBT.PROJECTS_SCH.DBT   &#183;   change history:  CONFIG_DB.SCHEMACHANGE.{DEV|PROD}_CHANGE_HISTORY</text>
  <text x="650" y="1022" text-anchor="middle" font-size="10.5" fill="#b3bcc6">See README.md for conventions and DEVELOPER_GUIDE.md for file naming rules</text>

</svg>
